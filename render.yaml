# Render.com 一键部署配置（免费 Web Service，永久公网链接）
# 部署后请到 Dashboard -> Environment 查看自动生成的 OWNER_TOKEN，并在 App 内「设置 → 云端账号」绑定。
services:
  - type: web
    name: baby-workbench-cloud
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: "echo skip-build"
    startCommand: "node server.js"
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OWNER_TOKEN
        generateValue: true
      # GitHub 持久化：把权威数据存到仓库文件 cloud-data/store.json（加密），
      # 彻底解决免费版临时磁盘重置导致数据丢失的问题。
      - key: GITHUB_REPO
        value: "zhangpan007/baby-workbench-cloud"
      - key: GITHUB_DATA_PATH
        value: "cloud-data/store.json"
      # 加密密钥：Render 自动随机生成并保密存储，不会写入仓库源码。请勿手动修改。
      - key: DATA_ENC_KEY
        generateValue: true
      # 仓库读写令牌：sync:false 表示不写入仓库源码，需到 Render 后台手动填入
      # 你的 fine-grained token（仅授权 baby-workbench-cloud 仓库、Contents: Read and write）。
      - key: GITHUB_TOKEN
        sync: false
      # GitHub 写入 debounce：合并 5 分钟内的多次数据变更为一次 sync commit，
      # 避免每次操作都触发 Render 部署（commit message 同步加 [skip render] 双保险）。
      - key: GITHUB_DEBOUNCE_MS
        value: "300000"
